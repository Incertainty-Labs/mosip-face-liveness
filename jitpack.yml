# JitPack's image defaults to an older JDK; liveness-desktop and liveness-eval need 21.
# SDKMAN identifiers are exact (there is no "21-open" alias) and can be renamed: 21.0.12+1.1-tem stopped downloading
# on 25 Oct 2026 while 21.0.12-tem works. Check with `sdk list java` when bumping. Zulu is the fallback.
before_install:
  - sdk install java 21.0.12-tem || sdk install java 21.0.12-zulu
  - sdk use java 21.0.12-tem || sdk use java 21.0.12-zulu
install:
  # No `java -version` check here: in this step plain `java` is not the JDK that sdk set up, while Maven is (0.2.4)
  - mvn wrapper:wrapper -Dmaven=3.9.9
  - ./mvnw -B install -DskipTests
